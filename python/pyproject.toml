[project]
name = "tickforge"
version = "0.1.0"
description = "tickforge Python glue: download, normalize, verify, drill Binance tick data"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=18",
    "duckdb>=1.1",
    "httpx>=0.27",
    "typer>=0.12",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

# Virtual (non-packaged) env for now: scripts are run via `uv run`.
# Packaging can come later (Phase 2+) when TF-cli/parquet glue need a real install.
[tool.uv]
package = false
